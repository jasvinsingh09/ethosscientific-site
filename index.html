<style>
  :root {
    --navy: #032248;
    --navy-deep: #021936;
    --teal: #32847c;
    --white: #ffffff;
    --mist: #eef3f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--navy);
    background: var(--navy-deep);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    border-top: 4px solid var(--teal);
    padding: 26px 24px;
    text-align: center;
  }
  header a {
    font-family: "Montserrat", sans-serif;
    font-weight: 600;
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.22em;
    color: var(--navy);
    text-decoration: none;
  }

  /* ---------- Hero (logo backdrop) ---------- */
  .hero {
    position: relative;
    min-height: 72vh;
    display: flex; align-items: center; justify-content: center;
    padding: 110px 24px 70px;
    background:
      radial-gradient(ellipse at center, #ffffff 0%, #f6f9fb 55%, #e7eef3 100%);
    overflow: hidden;
  }
  .hero::before {               /* faint molecule-line texture */
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(115deg, transparent 0 48%, rgba(50,132,124,.06) 48% 52%, transparent 52% 100%);
    background-size: 160px 160px;
    pointer-events: none;
  }

  /* ---------- Contact ---------- */
  .contact {
    background: var(--navy-deep);
    color: var(--white);
    text-align: center;
    padding: 72px 24px 48px;
  }
  .contact h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 400;
    font-size: clamp(32px, 4.5vw, 44px);
    color: #c9d5e3;
  }
  .divider {
    width: 44px; height: 1px; margin: 26px auto 34px;
    background: var(--teal);
  }
  .contact h3 {
    font-weight: 400;
    font-size: 20px;
    margin-bottom: 30px;
  }
  form {
    max-width: 476px;
    margin: 0 auto;
    display: grid; gap: 20px;
    text-align: left;
  }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    font: inherit; font-size: 16px;
    color: var(--white);
    background: transparent;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 4px;
    padding: 12px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,.6); }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(50,132,124,.35);
  }
  textarea { min-height: 156px; resize: vertical; }
  .optin {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 15px; color: rgba(255,255,255,.7);
    cursor: pointer;
  }
  .optin input { width: 18px; height: 18px; accent-color: var(--teal); }
  button {
    justify-self: center;
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: .12em;
    color: var(--navy);
    background: var(--white);
    border: none; border-radius: 4px;
    padding: 16px 26px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button:hover { background: var(--teal); color: var(--white); }
  .form-note {
    min-height: 1.4em;
    text-align: center;
    font-size: 15px;
    color: #9fd3cc;
  }

  /* ---------- Footer ---------- */
  footer {
    background: var(--navy-deep);
    border-top: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.6);
    font-size: 14px;
    padding: 28px 34px;
  }

  @media (max-width: 600px) {
    .hero { min-height: 56vh; padding-top: 96px; }
    footer { text-align: center; }
  }
</style>
</head>
<body>

<header>
  <a href="/">ETHOS SCIENTIFIC</a>
</header>

<main>
  <section class="hero" aria-label="Ethos Scientific">
    <div class="hero-logo" role="img" aria-label="Ethos Scientific logo — Integrity in Science. Focused on Patient Outcomes."></div>
    <h1 class="sr-only">Ethos Scientific — Integrity in Science. Focused on Patient Outcomes.</h1>
  </section>

  <section class="contact" id="contact">
    <h2>Contact Us</h2>
    <div class="divider"></div>
    <h3>Drop us a line!</h3>

    <!-- Sends via the visitor's email app. To receive messages without that step,
         replace the action with a form service endpoint (e.g. Formspree) and remove the script below. -->
    <form id="contact-form" action="mailto:info@ethosscientific.ai" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Name" autocomplete="name">
      <input type="email" name="email" placeholder="Email*" required autocomplete="email">
      <textarea name="message" placeholder="Message"></textarea>
      <label class="optin">
        <input type="checkbox" name="subscribe">
        Sign up for our email list for updates, promotions, and more.
      </label>
      <button type="submit">SEND</button>
      <p class="form-note" id="form-note" aria-live="polite"></p>
    </form>
  </section>
</main>

<footer>
  Copyright © <span id="year">2026</span> Ethos Scientific - All Rights Reserved.
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const CONTACT_EMAIL = 'info@ethosscientific.ai';
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const f = e.target;
    if (!f.email.checkValidity()) { f.email.reportValidity(); return; }
    const body =
      'Name: ' + f.name.value + '\n' +
      'Email: ' + f.email.value + '\n' +
      'Email list opt-in: ' + (f.subscribe.checked ? 'Yes' : 'No') + '\n\n' +
      f.message.value;
    window.location.href = 'mailto:' + CONTACT_EMAIL +
      '?subject=' + encodeURIComponent('Website inquiry from ' + (f.name.value || f.email.value)) +
      '&body=' + encodeURIComponent(body);
    document.getElementById('form-note').textContent = 'Thanks! Your email app should open to send your message.';
  });
</script>
</body>
</html>
